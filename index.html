<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeenLogo | Premium Logo Marketplace</title>

<style>
:root {
    --bg-dark: #090a0f;
    --card-bg: #12141d;
    --border-color: #222634;
    --accent-blue: #3b82f6; 
    --accent-blue-hover: #2563eb;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.5;
    position: relative;
    overflow-x: hidden;
}

/* ================= ARKA PLAN VE ANİMASYON (Aşağıdan Yukarı) ================= */

.bg-pattern {
    position: fixed;
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    background-image: url('1000274954_2.jpg');[span_0](start_span)[span_0](end_span)
    background-size: 300px;
    opacity: 0.15; 
    filter: blur(5px); 
    z-index: -1;
    animation: scrollBackgroundUp 15s linear infinite;
}

@keyframes scrollBackgroundUp {
    0% { background-position: 0 300px; } 
    100% { background-position: 0 0; }   
}

/* ================= REKLAM ŞERİDİ (PROMO BANNER) ================= */

.promo-banner {
    background: linear-gradient(90deg, #1e3a8a, #0f172a, #3b82f6);
    color: white;
    padding: 10px 0;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    z-index: 1001;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.promo-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 20s linear infinite;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
}

@keyframes marquee {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-100%); }
}

/* ================= HEADER & NAVBAR ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background: rgba(9, 10, 15, 0.88);
    border-bottom: 1px solid var(--border-color);
    backdrop-filter: blur(14px);
}

.navbar{
    max-width:1200px;
    margin:auto;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.menu-btn {
    background: transparent;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
}

.menu-btn:hover {
    color: var(--accent-blue);
}

.logo{
    font-size:26px;
    font-weight:900;
    letter-spacing:-1px;
    color:white;
    display: flex;
    align-items: center;
}

.logo span{
    color: var(--accent-blue);
}

.desktop-nav {
    display: none; 
}

.cart-button{
    background: #1e2230;
    border: 1px solid var(--border-color);
    color:white;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight: 600;
    transition: 0.2s;
}

.cart-button:hover {
    border-color: var(--accent-blue);
}

.cart-count{
    background: var(--accent-blue);
    color: #fff;
    padding:2px 7px;
    border-radius:20px;
    font-size:11px;
    margin-left:6px;
}

/* ================= YAN MENÜ (SIDEBAR) ================= */

.sidebar {
    position: fixed;
    top: 0;
    left: -300px;
    width: 280px;
    height: 100vh;
    background: rgba(14, 16, 23, 0.98);
    backdrop-filter: blur(15px);
    border-right: 1px solid var(--border-color);
    z-index: 3000;
    transition: left 0.3s ease;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
}

.sidebar.active {
    left: 0;
}

.sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 15px;
}

.sidebar-header h2 {
    font-size: 20px;
    color: white;
}

.close-sidebar {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 30px;
    cursor: pointer;
}

.close-sidebar:hover {
    color: var(--accent-blue);
}

.sidebar-links {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.sidebar-links a {
    color: var(--text-main);
    text-decoration: none;
    font-size: 16px;
    padding: 12px 15px;
    border-radius: 8px;
    background: #1a1d27;
    border: 1px solid transparent;
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
}

.sidebar-links a:hover {
    background: #232736;
    border-color: var(--border-color);
    color: var(--accent-blue);
}

/* ================= HERO ================= */

.hero{
    min-height:500px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 20px;
    background: radial-gradient(circle at center, rgba(15, 23, 42, 0.6) 0%, transparent 70%);
}

.hero-content{
    max-width:850px;
}

.badge{
    display:inline-block;
    padding:6px 16px;
    border:1px solid #1e3a8a;
    background: #0f172a;
    border-radius:30px;
    color: #93c5fd;
    font-size:13px;
    font-weight: 600;
    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(40px,7vw,75px);
    line-height:1.05;
    letter-spacing:-2px;
    margin-bottom:20px;
}

.hero h1 span{
    color: var(--text-muted);
}

.hero p{
    color: var(--text-muted);
    font-size:18px;
    max-width:650px;
    margin:auto;
}

.hero-buttons{
    margin-top:30px;
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

.primary{
    background: var(--accent-blue);
    color: #fff;
    border:none;
    padding:14px 28px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    transition: 0.2s;
}

.primary:hover {
    background: var(--accent-blue-hover);
}

/* ================= GENERAL ================= */

section{
    max-width:1200px;
    margin:auto;
    padding:70px 20px;
}

.section-title{
    margin-bottom:35px;
}

.section-title h2{
    font-size:34px;
    margin-bottom:8px;
}

.section-title p{
    color: var(--text-muted);
}

/* ================= STORE (HAZIR LOGOLAR) ================= */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(300px, 380px));
    gap:25px;
    justify-content: center;
}

.product{
    background: var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:16px;
    overflow:hidden;
    transition:.3s;
    display: flex;
    flex-direction: column;
}

.product:hover{
    transform:translateY(-6px);
    border-color: var(--accent-blue);
}

.product-image{
    height:280px;
    background: #000;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

/* Yeni eklenen logo görseli */
.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Turuncu logoyu mavi temaya uyarlamak için filtre */
    filter: hue-rotate(150deg) saturate(1.5);
}

/* Koruması yazısı tam ortalandı */
.blur-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    height: 60px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    pointer-events: none;
}

.blur-overlay span {
    color: rgba(255, 255, 255, 0.9);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
}

.product-info{
    padding:22px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.product-info h3{
    margin-bottom:6px;
    font-size: 20px;
}

.product-info p{
    color: var(--text-muted);
    font-size:14px;
    line-height:1.6;
    flex-grow: 1;
}

.price-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
}

.price{
    font-size:22px;
    font-weight:bold;
    color: var(--accent-blue);
}

.buy{
    border:none;
    background: #1e293b;
    color: #fff;
    border: 1px solid var(--border-color);
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    transition: 0.2s;
}

.buy:hover {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
}

/* ================= FORMS ================= */

.form-box{
    max-width:700px;
    margin:auto;
    background: var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:16px;
    padding:32px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color: var(--text-muted);
    font-size:14px;
}

.form-group input,
.form-group textarea{
    width:100%;
    background: #0a0c12;
    border:1px solid var(--border-color);
    color:white;
    border-radius:8px;
    padding:13px;
    outline:none;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color: var(--accent-blue);
}

/* ================= CART OVERLAY ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:4000;
    display:none;
    backdrop-filter: blur(4px);
}

.overlay.active{
    display:block;
}

.cart-panel{
    position:absolute;
    right:0;
    top:0;
    height:100%;
    width:min(430px,100%);
    background: #0f111a;
    border-left:1px solid var(--border-color);
    padding:25px;
    overflow:auto;
}

.close{
    float:right;
    background:none;
    border:none;
    color: var(--text-muted);
    font-size:25px;
    cursor:pointer;
}

.cart-item{
    padding:16px 0;
    border-bottom:1px solid var(--border-color);
}

.cart-item-top{
    display:flex;
    justify-content:space-between;
}

.remove{
    background:none;
    border:none;
    color: #ef4444;
    cursor:pointer;
    font-size: 13px;
}

.cart-total{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
    font-size:22px;
    font-weight:bold;
}

.checkout{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:8px;
    background: var(--accent-blue);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition: 0.2s;
}

.checkout:hover {
    background: var(--accent-blue-hover);
}

/* ================= FOOTER ================= */

<footer>
<div style="display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:10px;">
    <span style="color:white; font-weight:bold; font-size:22px;"><span style="color: var(--accent-blue);">Keen</span>Logo</span>
</div>
<p>Digital Branding & Design</p>
<p style="margin-top:10px; font-size: 12px;">© 2026 KeenLogo. Tüm hakları saklıdır.</p>
</footer>

<script>
/* ================= YAN MENÜ (SIDEBAR) JS ================= */
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
}

/* ================= CART SYSTEM ================= */
let cart = JSON.parse(localStorage.getItem("keen_cart")) || [];

function addToCart(name, price){
    cart.push({ name, price });
    saveCart();
    alert(`"${name}" səbətinizə əlavə olundu.`);
}

function removeFromCart(index){
    cart.splice(index, 1);
    saveCart();
}

function saveCart() {
    localStorage.setItem("keen_cart", JSON.stringify(cart));
    updateCartUI();
}

function updateCartUI(){
    const count = document.getElementById("cartCount");
    const items = document.getElementById("cartItems");
    const totalElement = document.getElementById("cartTotal");

    count.innerText = cart.length;
    items.innerHTML = "";
    let total = 0;

    if(cart.length === 0){
        items.innerHTML = "<p style='color:var(--text-muted); padding:20px 0;'>Səbətiniz boşdur.</p>";
    }

    cart.forEach((item, index) => {
        total += item.price;
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
            <div class="cart-item-top">
                <strong>${item.name}</strong>
                <button class="remove" onclick="removeFromCart(${index})">Sil</button>
            </div>
            <p style="color:var(--text-muted); margin-top:4px; font-size:14px;">${item.price} AZN</p>
        `;
        items.appendChild(div);
    });

    totalElement.innerText = total + " AZN";
}

function openCart(){
    document.getElementById("cartOverlay").classList.add("active");
}

function closeCart(){
    document.getElementById("cartOverlay").classList.remove("active");
}

function checkout(){
    if(cart.length === 0){
        alert("Lütfen önce vitrinden bir logo seçin.");
        return;
    }
    
    let itemsList = cart.map(i => `- ${i.name} (${i.price} AZN)`).join('\n');
    let total = cart.reduce((sum, i) => sum + i.price, 0);
    
    let subject = encodeURIComponent("Yeni Hazır Logo Siparişi - KeenLogo");
    let body = encodeURIComponent(`Merhaba, aşağıdaki hazır logoları satın almak istiyorum:\n\n${itemsList}\n\nToplam Tutar: ${total} AZN`);
    
    window.location.href = `mailto:keendesignlogo@gmail.com?subject=${subject}&body=${body}`;
}

/* ================= GMAIL REDIRECT FUNCTIONS ================= */
function sendCustomNameRequest() {
    const sector = document.getElementById("customSector").value.trim();
    const notes = document.getElementById("customNotes").value.trim();

    if(!sector && !notes) {
        alert("Lütfen sektörünüzü veya beklentilerinizi belirtin.");
        return;
    }
    const subject = encodeURIComponent("Yeni Firma İsmi ve Konsept Talebi");
    const body = encodeURIComponent(`Merhaba KeenLogo,\n\nİşletmem için özel bir isim ve logo fikri talep ediyorum:\n\n• Faaliyet Alanı (Sektör): ${sector}\n• Beklentiler / Detaylar: ${notes}`);
    window.location.href = `mailto:keendesignlogo@gmail.com?subject=${subject}&body=${body}`;
}

function sendDirectMessage() {
    const msgSubject = document.getElementById("msgSubject").value.trim() || "Özel Tasarım Görüşmesi";
    const msgBody = document.getElementById("msgBody").value.trim();

    if(!msgBody) {
        alert("Lütfen tasarım detaylarını içeren bir mesaj yazın.");
        return;
    }
    const subject = encodeURIComponent(msgSubject);
    const body = encodeURIComponent(msgBody);
    window.location.href = `mailto:keendesignlogo@gmail.com?subject=${subject}&body=${body}`;
}

/* ================= INIT ================= */
updateCartUI();
</script>
</body>
</html>
